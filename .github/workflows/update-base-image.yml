name: Auto Update Base Image

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Ensure Python is available
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Determine current BASE_IMAGE
        id: current
        run: |
          CURRENT=$(grep '^ARG BASE_IMAGE=' docker/Dockerfile | cut -d'=' -f2-)
          echo "CURRENT=$CURRENT" >> $GITHUB_OUTPUT

      - name: Resolve latest debian:trixie-slim digest
        id: latest
        run: |
          TOKEN=$(python3 - <<'PY'
          import json, urllib.request
          url = 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/debian:pull'
          with urllib.request.urlopen(url) as response:
              print(json.load(response)['token'])
          PY
          )
          DIGEST=$(curl -fsSI \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://registry-1.docker.io/v2/library/debian/manifests/trixie-slim" \
            | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="docker-content-digest" {print $2; exit}')
          if [ -z "$DIGEST" ]; then
            echo "Failed to get digest" >&2
            exit 1
          fi
          LATEST=debian:trixie-slim@${DIGEST}
          echo "LATEST=$LATEST" >> $GITHUB_OUTPUT

      - name: Update Dockerfile with pinned base image
        if: steps.current.outputs.CURRENT != steps.latest.outputs.LATEST
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          echo "Updating BASE_IMAGE from '${{ steps.current.outputs.CURRENT }}' to '${{ steps.latest.outputs.LATEST }}'"
          sed -i "s|^ARG BASE_IMAGE=.*|ARG BASE_IMAGE=${{ steps.latest.outputs.LATEST }}|" docker/Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin test
          git checkout test
          git pull --rebase origin test
          git add docker/Dockerfile
          git commit -m "ci: bump base image to ${{ steps.latest.outputs.LATEST }}"
          git push https://${BOT_PAT}@github.com/${{ github.repository }}.git test

      - name: No update needed
        if: steps.current.outputs.CURRENT == steps.latest.outputs.LATEST
        run: |
          echo "Base image is already up to date: ${{ steps.current.outputs.CURRENT }}"
